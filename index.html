<style>

*{box-sizing:border-box;margin:0}

/* start */
#start{text-align:center;padding-top:5vh}
.seal{width:132px;height:132px;margin:0 auto 26px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2c3fb0,#070b3f 70%);box-shadow:inset 0 0 0 6px #070b3f,inset 0 0 0 7px #d9b25f66,0 20px 50px #0008}

h1{font:700 clamp(32px,6vw,62px)/1.08 var(--disp);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.sub{color:var(--mut);max-width:520px;margin:0 auto 30px}
.rules{max-width:640px;margin:0 auto 34px;text-align:left;display:grid;gap:0;border:1px solid #d9b25f55;background:#060a3866}
.rules div{padding:11px 18px;border-bottom:1px solid #d9b25f26;color:var(--mut);font-size:14px}.rules div:last-child{border:0}
.rules b{color:var(--gold);font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;margin-right:10px}
.cta{padding:2px;background:var(--gold);transition:filter .2s,transform .2s;display:inline-block}
.cta span{display:block;padding:15px 52px;background:linear-gradient(180deg,#1a2a96,#080d45);font:700 15px var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);clip-path:inherit}
.cta:hover{filter:brightness(1.2);transform:translateY(-1px)}.cta:disabled{opacity:.6;cursor:wait}
/* game */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.jk{display:flex;gap:12px}
.joker{position:relative;width:78px;height:46px;border-radius:50%;border:1px solid var(--gold);background:linear-gradient(180deg,#1b2a96,#070b3f);font:700 14px var(--disp);color:var(--gold);display:grid;place-items:center;transition:.2s}
.joker svg{width:24px;height:20px}
.joker:hover:not(:disabled){box-shadow:0 0 0 3px #d9b25f33;filter:brightness(1.25)}
.joker:disabled{opacity:.45;border-color:#6d7399;color:#8a90b8;cursor:not-allowed}
.joker:disabled::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font:400 34px var(--sans);color:var(--bad)}
.clock{position:relative;width:70px;height:70px}.clock svg{transform:rotate(-90deg)}.clock circle{fill:#070b3f;stroke-width:3}
#ring{stroke:var(--gold);transition:stroke-dashoffset 1s linear,stroke .4s}
#tn{position:absolute;inset:0;display:grid;place-items:center;font:700 24px var(--disp);font-variant-numeric:tabular-nums}
.clock.low #ring{stroke:var(--bad)}.clock.low #tn{color:#ff7a70}.clock.low{animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.prize{text-align:right;font:700 22px var(--disp);color:var(--gold)}.prize small{display:block;font:500 10px var(--sans);letter-spacing:.2em;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 230px;gap:34px}
.qwrap{position:relative;margin:6px 0 18px}
.qwrap::before{content:"";position:absolute;left:-30px;right:-30px;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 14%,var(--gold) 86%,transparent)}
.qb{position:relative;padding:2px;background:var(--gold)}
.q{display:grid;place-items:center;text-align:center;min-height:116px;padding:22px 44px;font:500 clamp(18px,2.6vw,25px)/1.35 var(--sans);background:linear-gradient(180deg,#1a2a96,#070b3f);clip-path:inherit;animation:fade .5s}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;position:relative}
.ans::before{content:"";position:absolute;left:-30px;right:-30px;top:50%;height:0;border-top:1px solid #d9b25f40;z-index:0}
.a{position:relative;z-index:1;padding:2px;background:var(--gold);transition:transform .15s,filter .15s;animation:fade .5s backwards;display:block;width:100%;text-align:left}
.a:nth-child(2){animation-delay:.06s}.a:nth-child(3){animation-delay:.12s}.a:nth-child(4){animation-delay:.18s}
.a .in{display:flex;gap:12px;align-items:center;padding:14px 34px;min-height:56px;font-weight:500;font-size:clamp(14px,2vw,17px);background:linear-gradient(180deg,#141f84,#060a38);clip-path:inherit;transition:background .2s,color .2s}
.a i{font:700 15px var(--disp);color:var(--lock);font-style:normal}
@media(hover:hover){.a:hover:not(:disabled):not(.sel):not(.ok):not(.bad){filter:brightness(1.2)}
.a:hover:not(:disabled):not(.sel):not(.ok):not(.bad) .in{background:linear-gradient(180deg,#2638b0,#0c1260)}}
.a.sel{background:var(--lock)}.a.sel .in{background:linear-gradient(180deg,#f0a430,#b8680c);color:#1c0e00}.a.sel i{color:#1c0e00}
.a.ok{background:#4be08a}.a.ok .in{background:linear-gradient(180deg,#25b062,#0f7038);color:#fff;animation:flash .3s 4}.a.ok i{color:#fff}
.a.bad{background:#ff8d86}.a.bad .in{background:linear-gradient(180deg,#d8453c,#8d1d17);color:#fff}.a.bad i{color:#fff}
.a.gone{visibility:hidden}
.a:disabled{cursor:default}
@keyframes flash{50%{filter:brightness(1.6)}}
.bar{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:50px;flex-wrap:wrap}
.msg{color:var(--mut);font-size:14px}
.final{font:700 17px var(--disp);color:var(--gold);letter-spacing:.04em}.final.safe{color:#4be08a;animation:flash .35s 3}
.btn{padding:11px 24px;border:1px solid var(--gold);font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);transition:.2s}
.btn:hover{background:var(--gold);color:#120d00}.btn.go{background:var(--gold);color:#120d00}.btn.go:hover{filter:brightness(1.15)}
.btn.walk{border-color:#6f78b8;color:#b5bdf0}.btn.walk:hover{background:#6f78b8;color:#060a38}
.aud{display:flex;gap:16px;align-items:flex-end;height:128px;padding:14px 22px;margin-bottom:14px;border:1px solid #d9b25f66;background:#060a38cc;animation:fade .4s}
.aud div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px;font-size:12px;color:var(--mut)}
.aud b{width:100%;max-width:50px;background:linear-gradient(180deg,#f0c56a,var(--gold2));transition:height .9s cubic-bezier(.2,.8,.2,1);height:0}
.aud em{font:700 13px var(--disp);font-style:normal;color:var(--ink)}
.ladder{display:flex;flex-direction:column-reverse;align-self:start;border:1px solid #d9b25f55;background:#060a3899;padding:6px}
.l{display:flex;justify-content:space-between;padding:6px 14px;font:500 14px var(--sans);font-variant-numeric:tabular-nums;color:var(--lock)}
.l span:first-child{opacity:.7;width:26px}
.l.safe{color:#fff;font-weight:600}
.l.done{opacity:.4}
.l.cur{background:var(--lock);color:#1c0e00;font-weight:700}
#end{text-align:center;padding-top:9vh}
#end .eb{font:600 12px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
#end .big{font:700 clamp(54px,13vw,120px)/1 var(--disp);color:var(--gold);margin:14px 0 18px}

html,body{height:100%;overflow:hidden}
.wrap{height:100dvh;display:flex;flex-direction:column;padding-top:10px;padding-bottom:10px}
.screen.on{flex:1;min-height:0;display:flex;flex-direction:column}
#start,#end{justify-content:center;padding-top:0}
.nav{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:14px;z-index:5}
.top{margin-bottom:10px}.clock,.clock svg{width:56px;height:56px}#tn{font-size:20px}.joker{height:38px}.prize{font-size:18px}
.grid{flex:1;min-height:0}
.qwrap{margin:0 0 10px}.q{min-height:0;padding:14px 34px;font-size:clamp(15px,2.3vh,24px)}
.ans{gap:8px 20px}.a .in{min-height:0;padding:10px 30px;font-size:clamp(13px,2vh,17px)}
.bar{margin-top:10px;min-height:40px}
.l{padding:4px 14px;font-size:13px}
.pct{margin-left:auto;font:700 14px var(--disp);font-style:normal;color:var(--gold)}
.a[style*="--p"] .in{background-image:linear-gradient(90deg,#d9b25f66 var(--p),transparent var(--p)),linear-gradient(180deg,#141f84,#060a38)}
@media(max-width:620px){.q{padding:12px 24px}.a .in{padding:9px 24px}}
/* desktop-only layout (>=861px): bigger, roomier answers; phones and tablets keep the layout above */
@media(min-width:861px){
.wrap{max-width:1280px}
.grid{grid-template-columns:minmax(0,1fr) 270px;grid-template-rows:minmax(0,1fr);gap:48px}
.grid>div:first-child{display:flex;flex-direction:column;min-height:0}
.qwrap{flex:0 0 auto;margin:clamp(6px,2vh,22px) 0 clamp(16px,3vh,30px)}
.qb{width:100%}
.q{min-height:clamp(96px,17vh,180px);padding:clamp(18px,3vh,34px) 64px;font-size:clamp(20px,3.3vh,32px);line-height:1.35}
.ans{gap:clamp(12px,2.2vh,22px) 40px}
.a .in{gap:16px;min-height:clamp(60px,10vh,92px);padding:12px 48px;font-size:clamp(16px,2.6vh,23px);line-height:1.3}
.a i{flex:none;font-size:clamp(16px,2.4vh,22px)}
.top{padding-top:16px}
.bar{margin-top:clamp(12px,2.2vh,24px);min-height:48px}
.msg{font-size:15px}
.btn{padding:12px 28px;font-size:13px}
.ladder{align-self:stretch;padding:8px}
.l{flex:1 1 0;align-items:center;padding:2px 16px;font-size:clamp(13px,2vh,18px)}
.l span:first-child{width:32px}
}

<section id="start" class="screen on">

  </div>
  <div class="ladder" id="ladder"></div>
 </div>
</section>

<section id="end" class="screen">

</section>
</div>

const sfx={pick(){beep(440,.08,"triangle")},win(){[523,659,784,1047].forEach((x,k)=>beep(x,.3,"triangle",.05,k*.1))},lose(){[294,247,196,147].forEach((x,k)=>beep(x,.45,"sawtooth",.035,k*.2))},tick(){beep(880,.03,"square",.015)}};
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));scrollTo(0,0)}
const floor=()=>{let b=0;SAFE.forEach(s=>{if(i>s)b=L[s]});return b},won=()=>i>0?L[i-1]:0;
function ladder(){$("ladder").innerHTML=L.map((m,k)=>`<div class="l${SAFE.includes(k)||k==14?" safe":""}${k<i?" done":""}${k==i?" cur":""}"><span>${k+1}</span><span>${f(m)}</span></div>`).join("")}
function start(){G=build();i=0;jf=ja=1;show("game");load()}
function load(){
 clearInterval(tm);locked=false;sel=null;cur=G[i];opts=sh([cur.a,...cur.w]);$("audbox").innerHTML="";
 $("q").textContent=cur.q;$("q").style.animation="none";void $("q").offsetWidth;$("q").style.animation="";
 $("pf").textContent=f(L[i]);$("pf").previousElementSibling.textContent=`QUESTION ${i+1} OF 15${floor()?" · SAFE "+f(floor()):""} · PLAYING FOR`;ladder();
 $("ans").innerHTML=opts.map((o,k)=>`<button class="a hex" data-k="${k}"><span class="in"><i>${"ABCD"[k]}:</i>${o}</span></button>`).join("");
 document.querySelectorAll(".a").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 jk();bar();timer();
}
const A=()=>document.querySelectorAll(".a"),goneN=()=>document.querySelectorAll(".a.gone").length;
function jk(){$("jf").disabled=!jf||locked||goneN()>0;$("ja").disabled=!ja||locked}
function bar(){
 if(locked)return;const b=$("bar");
 if(sel!==null){b.innerHTML=`<span class="final">Is that your final answer?</span><span><button class="btn walk" id="no">Change</button> <button class="btn go" id="yes">Final answer</button></span>`;$("no").onclick=unsel;$("yes").onclick=lock}
 else{b.innerHTML=`<span class="msg">Choose an answer, or walk away with ${f(won())}.</span><button class="btn walk" id="wk">Walk away</button>`;$("wk").onclick=walk}
}
function unsel(){sel=null;A().forEach(x=>x.classList.remove("sel"));bar()}
function pick(k){if(locked)return;sel=k;sfx.pick();A().forEach(x=>x.classList.toggle("sel",+x.dataset.k===k));bar()}
function timer(){t=90;draw();tm=setInterval(()=>{t--;draw();if(t<=10&&t>0)sfx.tick();if(t<=0){clearInterval(tm);timeout()}},1000)}
function draw(){$("tn").textContent=t;$("ring").style.strokeDashoffset=201.06*(1-t/90);$("clock").classList.toggle("low",t<=15)}
$("jf").onclick=()=>{
 if(!jf||locked)return;jf=0;const c=opts.indexOf(cur.a);
 sh([0,1,2,3].filter(k=>k!==c)).slice(0,2).forEach(k=>A()[k].classList.add("gone"));
 if(sel!==null&&A()[sel].classList.contains("gone"))unsel();sfx.win();jk();
};
$("ja").onclick=()=>{
 if(!ja||locked)return;ja=0;jk();sfx.win();
 const c=opts.indexOf(cur.a),alive=[0,1,2,3].filter(k=>!A()[k].classList.contains("gone")),rest=alive.filter(k=>k!==c);
 let top=Math.round(94-i*4.2+(Math.random()*12-6));top=Math.max(34,Math.min(92,top));if(alive.length===2)top=Math.max(top,55);
 const r=rest.map(()=>Math.random()+.2),s=r.reduce((a,b)=>a+b,0),pc={[c]:top};let left=100-top;
 rest.forEach((k,n)=>{pc[k]=n===rest.length-1?left:Math.round((100-top)*r[n]/s);left-=pc[k]});
 alive.forEach(k=>{const b=A()[k];b.style.setProperty("--p",pc[k]+"%");b.querySelector(".in").insertAdjacentHTML("beforeend",`<em class="pct">${pc[k]}%</em>`)});
};
function lock(){
 locked=true;clearInterval(tm);jk();$("bar").innerHTML=`<span class="final">Let’s see…</span>`;const c=opts.indexOf(cur.a);
 setTimeout(()=>{
  A().forEach(x=>x.classList.remove("sel"));A()[c].classList.add("ok");
  if(sel===c){sfx.win();
   if(i===14)return setTimeout(()=>end("win"),1800);
   $("bar").innerHTML=`<span class="final${SAFE.includes(i)?" safe":""}">${SAFE.includes(i)?"Safe haven reached! "+f(L[i])+" is yours, whatever happens.":"Correct! "+f(L[i])}</span><button class="btn go" id="nx">Next question</button>`;$("nx").onclick=()=>{i++;load()};
  }else{A()[sel].classList.add("bad");sfx.lose();setTimeout(()=>end("lose"),2400)}
 },1800);
}
function walk(){
 if(!wc){wc=true;$("wk").textContent=`Take ${f(won())}?`;setTimeout(()=>{wc=false;if($("wk"))$("wk").textContent="Walk away"},3000);return}
 wc=false;clearInterval(tm);locked=true;jk();A()[opts.indexOf(cur.a)].classList.add("ok");
 $("bar").innerHTML=`<span class="final">The answer was ${cur.a}.</span>`;setTimeout(()=>end("walk"),2600);
}
function timeout(){locked=true;jk();sfx.lose();$("bar").innerHTML=`<span class="final">Time’s up.</span>`;A()[opts.indexOf(cur.a)].classList.add("ok");setTimeout(()=>end("time"),2400)}
function end(how){
 clearInterval(tm);show("end");let p,h,tx;
 if(how==="win"){p=1e6;h="Congratulations";tx="You answered all fifteen questions. You’re a millionaire."}
 else if(how==="walk"){p=won();h="You walked away";tx=`You leave the hot seat with ${f(p)}. Wise, or just cautious? We’ll never know.`}
 else{p=floor();h=how==="time"?"Out of time":"Wrong answer";tx=p?`You fall back to your safe haven and leave with ${f(p)}.`:"No safe haven reached, so you leave empty-handed."}
 $("eh").textContent=h;$("ep").textContent=f(p);$("et").textContent=tx;
}
$("play").onclick=start;$("again").onclick=start;
$("mute").onclick=()=>{mute=!mute;$("mute").textContent=mute?"Sound off":"Sound on"};
</script></body></html>
